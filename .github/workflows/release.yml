name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build eBPF object, Linux binaries, and macOS offline verifiers
        run: |
          make bpf-container
          make -j2 VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA::7}"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" -o dist/clatch-darwin-arm64 ./cmd/clatch
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" -o dist/clatch-darwin-amd64 ./cmd/clatch
          (cd dist && sha256sum clatch-linux-amd64 clatch-linux-arm64 clatch-darwin-arm64 clatch-darwin-amd64 > SHA256SUMS)

      - name: Smoke-test Linux release binary
        run: |
          ./dist/clatch-linux-amd64 version --json
          ./dist/clatch-linux-amd64 help --json > /dev/null

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/clatch-linux-amd64
            dist/clatch-linux-arm64
            dist/clatch-darwin-arm64
            dist/clatch-darwin-amd64
            dist/SHA256SUMS
