name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build eBPF object and release binaries
        run: |
          make bpf-container
          make -j2 VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA::7}"
          (cd dist && sha256sum clatch-linux-amd64 clatch-linux-arm64 > SHA256SUMS)

      - name: Smoke-test release binary
        run: |
          ./dist/clatch-linux-amd64 version --json
          ./dist/clatch-linux-amd64 help --json > /dev/null

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/clatch-linux-amd64
            dist/clatch-linux-arm64
            dist/SHA256SUMS
